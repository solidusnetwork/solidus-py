name: release

# Publishes to PyPI via Trusted Publishing (OIDC). There is no API token
# anywhere in this repository or in its secrets, by design: a token is a
# credential that can leak, be committed, or outlive the person who made it.
#
# One-time setup, in the PyPI web interface, by a maintainer:
#   PyPI -> your project -> Publishing -> Add a new pending publisher
#     Owner:            solidusnetwork
#     Repository name:  solidus-py
#     Workflow name:    release.yml
#     Environment:      pypi
#
# After that, pushing a v* tag publishes. Nothing else is required.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# Every action is pinned to an immutable commit SHA, not a tag. A tag is
# mutable: whoever controls the action's repository can repoint v4 at new code,
# and this workflow holds `id-token: write`, so a swapped action could mint the
# PyPI OIDC identity and publish anything under our name. The trailing comment
# records which version each SHA was, so upgrading stays legible.

jobs:
  wheels:
    name: wheel · ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64  }
          - { os: ubuntu-latest,  target: aarch64 }
          - { os: macos-latest,   target: aarch64 }
          # Intel macOS is cross-compiled from the arm64 runner. macos-13 was
          # used here and is a RETIRED runner image: the label is never assigned,
          # so the job sits queued forever and silently blocks the publish job
          # behind it. Measured once at ten hours with no runner and no error.
          - { os: macos-latest,   target: x86_64  }
          - { os: windows-latest, target: x64     }
    steps:
      # The test vectors are a submodule; without this the conformance tests
      # silently have nothing to compare against.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      # abi3-py39, so ONE wheel per platform covers Python 3.9 and newer.
      # The matrix is over operating systems, not interpreter versions.
      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}
          path: dist

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sdist
          path: dist

  publish:
    name: publish to PyPI
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # This is what makes Trusted Publishing work. It is also the only
      # credential in the whole workflow, and it is minted per-run by GitHub
      # rather than stored anywhere.
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: What is about to be published
        run: ls -la dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
