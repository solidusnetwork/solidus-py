[package]
name = "solidus-sdk-native"
version = "0.0.0"
edition = "2021"
publish = false

# The native half of `solidus-sdk`. Exists for one reason: BBS+ has no usable
# native Python implementation (P0, 2026-08-07), and byte-compatibility with
# `zkryptium 0.6` is the contract the conformance vectors encode.
#
# Everything that CAN be pure Python is pure Python — see python/solidus_network/.
# The smaller this file stays, the fewer platforms the wheel matrix has to cover.

[lib]
name = "solidus_network_native"
crate-type = ["cdylib"]

[dependencies]
# 0.29+ required: 0.23 fails to build against Python 3.14 outright.
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"] }
# BBS+ comes from a vendored copy of solidus-crypto's bbs module (src/bbs.rs),
# not a path dependency. The path escaped this repository and made a standalone
# clone unbuildable; these three crates are what that module actually imports.
# Versions match the monorepo lockfile so the vendored copy behaves identically.
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
zkryptium = "0.6.2"
thiserror = "2.0"
hex = "0.4"

[dev-dependencies]
# Used only by the vendored module's own #[cfg(test)] round-trip tests.
serde_json = "1.0"
