[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "solidus-network"
version = "0.1.0"
description = "Python SDK for the Solidus Network — did:solidus derivation, resolution and credential verification"
readme = "README.md"
license = { text = "Apache-2.0" }
keywords = [
  "did",
  "did-solidus",
  "decentralized-identity",
  "verifiable-credentials",
  "self-sovereign-identity",
  "bbs-signatures",
  "selective-disclosure",
  "ed25519",
  "w3c",
  "solidus",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Rust",
  "Topic :: Security :: Cryptography",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
requires-python = ">=3.9"
dependencies = [
    "blake3>=1.0",
    # PyNaCl, not `cryptography`. See tests/test_ed25519_strict.py: OpenSSL's
    # Ed25519 is permissive about small-order keys and we require strict.
    "pynacl>=1.5",
]

[project.urls]
Homepage = "https://solidus.network"
Repository = "https://github.com/solidusnetwork/solidus-py"
Documentation = "https://docs.solidus.network"
Changelog = "https://github.com/solidusnetwork/solidus-py/blob/main/CHANGELOG.md"
Issues = "https://github.com/solidusnetwork/solidus-py/issues"
"Conformance vectors" = "https://github.com/solidusnetwork/solidus-test-vectors"
"Sibling SDK (TypeScript)" = "https://www.npmjs.com/org/solidus-network"
"Sibling SDK (Go)" = "https://github.com/solidusnetwork/solidus-go"

[project.optional-dependencies]
dev = ["pytest>=8", "maturin>=1.0"]

[tool.maturin]
python-source = "python"
module-name = "solidus_network.solidus_network_native"

[tool.pytest.ini_options]
# doctest is the doc-example gate — the Python equivalent of the checker that
# exists because an outsider found four README blocks that did not compile.
# --doctest-glob makes README.md executable: a README that stops being true
# is a test failure. An outsider found four blocks in our TypeScript README
# that did not compile against the published packages; this is the response.
addopts = "--doctest-modules --doctest-glob=*.md"
testpaths = ["tests", "python/solidus_network", "README.md"]
